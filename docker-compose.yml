version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: scholarship-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: scholarship-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
    - ./certs:/certs:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:5000/api
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6Leuel4tAAAAALT1fi7dAMOu1anC78sMa1eOzbUl
    container_name: scholarship-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000/api
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6Leuel4tAAAAALT1fi7dAMOu1anC78sMa1eOzbUl
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data: